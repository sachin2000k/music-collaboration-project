<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Musician Dashboard - Project Collaboration</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-KyZXEJ3QhqLMpG8r+KnujsvNQ9gOqEJbM0Pb7+M5tmI7XjTZt69ZaK93Qmy2U57Z" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js" integrity="sha384-Piv4xVNRyMGpqkMcmS7gDj3vvsI/7c3gW9CZXpo1vlddk/ZR/pz2u6e1jz79joKX" crossorigin="anonymous"></script>
    <style>
        body {
            background-color: #f9fafb;
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            max-width: 900px;
        }
        h1 {
            color: #333;
            font-size: 2.5rem;
        }
        .form-control, .form-select {
            border-radius: 0.5rem;
        }
        .card {
            margin-top: 1rem;
            border-radius: 0.75rem;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease;
        }
        .card:hover {
            transform: translateY(-5px);
        }
        .card-header {
            background-color: #0069d9;
            color: white;
            text-align: center;
            font-size: 1.25rem;
            border-radius: 0.75rem 0.75rem 0 0;
        }
        .card-body {
            background-color: #ffffff;
            padding: 1.5rem;
        }
        .btn-custom {
            background-color: #0069d9;
            color: white;
            border-radius: 0.5rem;
        }
        .btn-custom:hover {
            background-color: #0056b3;
        }
        .project-card {
            background-color: #f1f1f1;
            border-radius: 0.75rem;
            margin-bottom: 1rem;
            padding: 1.5rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .project-card h5 {
            color: #333;
            font-size: 1.2rem;
        }
        .project-card p {
            color: #555;
        }
        .project-list {
            display: flex;
            flex-wrap: wrap;
            gap: 1.5rem;
        }
    </style>
</head>
<body>

    <div class="container mt-5">
        <div class="card">
            <div class="card-header">
                <h1>Musician Dashboard - Project Collaboration</h1>
            </div>
            <div class="card-body">
                <form id="createProjectForm">
                    <div class="mb-3">
                        <label for="projectDescription" class="form-label">Project Description</label>
                        <input type="text" class="form-control" id="projectDescription" required>
                    </div>
                    <div class="mb-3">
                        <label for="projectDeadline" class="form-label">Deadline</label>
                        <input type="date" class="form-control" id="projectDeadline" required>
                    </div>
                    <button type="submit" class="btn btn-custom w-100">Create Project</button>
                </form>
            </div>
        </div>

        <div class="card mt-4">
            <div class="card-body">
                <h2 class="text-center">My Projects</h2>
                <div id="projectList" class="project-list">
                    <!-- Dummy Data - Projects shown as cards -->
                    <div class="project-card">
                        <h5>New Album</h5>
                        <p>Deadline: 2024-12-31</p>
                    </div>
                    <div class="project-card">
                        <h5>Music Video Project</h5>
                        <p>Deadline: 2025-01-15</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Handle project creation
        $('#createProjectForm').on('submit', function(e) {
            e.preventDefault();
            let description = $('#projectDescription').val();
            let deadline = $('#projectDeadline').val();

            // Add new project to the list as a card
            let projectList = $('#projectList');
            projectList.append(`
                <div class="project-card">
                    <h5>${description}</h5>
                    <p>Deadline: ${deadline}</p>
                </div>
            `);

            // Reset the form
            $('#createProjectForm')[0].reset();
        });
    </script>

</body>
</html>
